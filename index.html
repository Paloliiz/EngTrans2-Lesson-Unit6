<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2 - Unit 6: Director's Cut 🎬</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@400;600&family=Bebas+Neue&display=swap');
        
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #e0e0e0;
            --primary: #e50914; /* Netflix Red */
            --accent: #fbc02d; /* Popcorn Yellow */
            --blue: #29b6f6;
            --success: #4caf50;
            --error: #f44336;
            --disabled: #333;
        }

        * { box-sizing: border-box; }

        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle, #222 1px, transparent 1px); background-size: 30px 30px; }
        
        /* Main Container */
        .container { width: 100%; max-width: 800px; background: #141414; border-radius: 15px; box-shadow: 0 0 60px rgba(229, 9, 20, 0.2); overflow: hidden; display: flex; flex-direction: column; height: 90vh; position: relative; border: 1px solid #333; }
        
        /* Header */
        .top-bar { padding: 15px 30px; background: linear-gradient(to bottom, #000, #1a1a1a); border-bottom: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .app-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8em; letter-spacing: 2px; color: var(--primary); text-shadow: 0 0 10px rgba(229, 9, 20, 0.6); }
        .user-badge { font-size: 0.8em; background: #333; color: #fff; padding: 5px 15px; border-radius: 4px; font-family: 'Courier Prime', monospace; border: 1px solid #555; }

        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background: #333; position: relative; flex-shrink: 0; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--primary); }

        /* Scrollable Content Area */
        .content-area { flex: 1; overflow-y: auto; padding: 30px; scroll-behavior: smooth; }
        
        /* Fixed Footer */
        .footer-bar { padding: 15px 30px; background: #1a1a1a; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

        /* Screens */
        .screen { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.6s ease-out; width: 100%; padding-bottom: 20px; }
        .screen.active { display: flex; }

        /* Typography */
        h2 { color: #fff; text-align: center; margin-bottom: 25px; font-weight: 600; font-size: 1.8em; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px; }
        p { line-height: 1.8; margin-bottom: 20px; color: #ccc; font-family: 'Sarabun', sans-serif; font-size: 1.15em; width: 100%; }
        
        /* Components */
        .info-card { background: #262626; border-left: 5px solid var(--accent); padding: 25px; border-radius: 8px; width: 100%; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; }
        .info-title { color: var(--accent); font-weight: bold; font-size: 1.3em; display: block; margin-bottom: 10px; font-family: 'Bebas Neue', cursive; letter-spacing: 1px; }
        .trivia-tag { position: absolute; top: -10px; right: 20px; background: var(--blue); color: #000; padding: 2px 10px; font-size: 0.8em; font-weight: bold; border-radius: 20px; transform: rotate(5deg); }

        /* Example Box */
        .example-box { background: #000; padding: 15px; border-radius: 5px; border: 1px dashed #555; margin: 10px 0; font-family: 'Sarabun', sans-serif; }
        .bad-ex { color: var(--error); text-decoration: line-through; display: block; margin-bottom: 5px; }
        .good-ex { color: var(--success); font-weight: bold; display: block; }

        /* Interactive Elements */
        .option-grid { display: grid; gap: 12px; width: 100%; }
        .quiz-option { width: 100%; padding: 18px 20px; text-align: left; background: #333; border: 1px solid #444; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Sarabun', sans-serif; font-size: 1.1em; color: #eee; position: relative; }
        .quiz-option:hover { background: #444; border-color: #fff; transform: translateX(5px); }
        .quiz-option.correct { background: rgba(76, 175, 80, 0.2); border-color: var(--success); color: var(--success); }
        .quiz-option.wrong { background: rgba(244, 67, 54, 0.2); border-color: var(--error); color: var(--error); }
        .quiz-option.locked { pointer-events: none; opacity: 0.6; }

        /* Cut Tool (Game) */
        .cut-container { background: #000; padding: 20px; border-radius: 10px; text-align: center; width: 100%; margin-bottom: 20px; border: 1px solid #333; }
        .cut-text { font-size: 1.3em; margin-bottom: 15px; color: #fff; line-height: 1.6; }

        /* Inputs & Buttons */
        input[type="number"] { padding: 18px; font-size: 1.5em; width: 100%; text-align: center; border: 2px solid #444; border-radius: 8px; margin: 25px 0; outline: none; background: #222; color: #fff; font-family: 'Courier Prime', monospace; letter-spacing: 2px; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(229, 9, 20, 0.4); }

        .btn { padding: 15px 40px; border: none; border-radius: 50px; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 5px 20px rgba(229, 9, 20, 0.4); }
        .btn-primary:hover { background: #b00710; transform: translateY(-3px); }
        .btn-disabled { background: #444 !important; color: #888 !important; cursor: not-allowed !important; transform: none !important; box-shadow: none !important; pointer-events: none; }
        
        .btn-nav-group { width: 100%; display: flex; justify-content: space-between; margin-top: auto; padding-top: 20px; }
        
        /* Footer Buttons */
        .footer-btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; transition: 0.2s; }
        .btn-back { background: transparent; color: #888; border: 1px solid #444; }
        .btn-back:hover { background: #333; color: #fff; }
        .btn-next { background: var(--primary); color: white; min-width: 150px; }
        .btn-next:hover { background: #b00710; transform: scale(1.05); }

        /* Certificate */
        .cert-card { border: 4px solid var(--accent); padding: 40px; margin-top: 10px; position: relative; background: radial-gradient(circle, #222 0%, #000 100%); width: 100%; text-align: center; overflow: hidden; box-shadow: 0 0 50px rgba(255, 179, 0, 0.15); }
        .cert-content { position: relative; z-index: 2; }
        .stamp { border: 3px solid var(--primary); color: var(--primary); display: inline-block; padding: 10px 20px; font-family: 'Bebas Neue'; font-size: 2em; letter-spacing: 3px; transform: rotate(-10deg); opacity: 0.8; margin-top: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    let currentSessionSlides = []; 

    // --- UTILS ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateQuizSet() {
        const shuffledPool = shuffleArray([...questionPool]);
        const selectedQuestions = shuffledPool.slice(0, 10);
        return selectedQuestions.map(qObj => {
            let opts = shuffleArray([...qObj.choices]);
            const correctIdx = opts.indexOf(qObj.ans);
            return { type: "quiz", q: qObj.q, options: opts, ans: correctIdx };
        });
    }

    function updateProgress() {
        const total = currentSessionSlides.length;
        const current = slideIndex + 1;
        const percent = (current / total) * 100;
        document.getElementById('progressBar').style.width = percent + '%';
    }

    // --- LOGIC ---
    function checkLogin() {
        const id = document.getElementById('inputID').value.trim();
        if (students[id]) {
            currentUser = students[id];
            currentUser.id = id;
            document.getElementById('userDisplay').innerText = `Director: ${currentUser.name}`;
            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('footerBar').style.display = 'flex';
            
            const randomQuizzes = generateQuizSet();
            currentSessionSlides = [...baseSlides, ...randomQuizzes];
            slideIndex = 0;
            renderSlide();
        } else { alert("⚠️ ไม่พบรหัสในระบบค่ะ"); }
    }

    function renderSlide() {
        document.getElementById('screen-lesson').innerHTML = ""; 
        document.getElementById('screen-lesson').style.display = "none";
        document.getElementById('screen-result').innerHTML = ""; 
        document.getElementById('screen-result').style.display = "none";

        if (slideIndex >= currentSessionSlides.length) { showResult(); return; }

        const s = currentSessionSlides[slideIndex];
        const screen = document.getElementById('screen-lesson');
        screen.style.display = "flex"; 
        screen.classList.add('active');
        
        updateProgress();

        if (s.type === 'quiz-intro') quizScore = 0;

        let html = `<h2>${s.title || "Scene " + (slideIndex - baseSlides.length + 1)}</h2>`;

        if (s.type === 'intro') {
            html += `<p style="white-space: pre-line; text-align:center;">${s.text}</p>`;
            lockNavigation(5);
        }
        else if (s.type === 'read' || s.type === 'quiz-intro') {
            html += `${s.html}`;
            if(s.type === 'read') lockNavigation(5);
        }
        else if (s.type === 'trim-game') {
            html += `<div class="cut-container">
                        <div class="cut-text">"${s.orig}"</div>
                        <div style="font-size:0.8em; color:#666;">(Length: ${s.orig.length} chars - Too Long!)</div>
                     </div>
                     <p style="text-align:center;">${s.desc}</p>
                     <div class="option-grid" id="trim-opts"></div>`;
        }
        else if (s.type === 'match-game') {
            html += `<div class="info-card" style="text-align:center; font-size:1.2em; padding:30px;">${s.q}</div>
                     <p style="text-align:center;">เลือกคำแปลที่เหมาะสมที่สุด:</p>
                     <div class="option-grid" id="match-opts"></div>`;
        }
        else if (s.type === 'quiz') {
            html += `<div class="info-card" style="font-weight:bold; font-size:1.2em; border-left-color:#fff;">${s.q}</div><div class="option-grid" id="quiz-options"></div>`;
        }

        screen.innerHTML = `<div style="width:100%;">${html}</div>`;

        // Reset Button State for Games
        const nextBtn = document.getElementById('nextBtn');
        if(s.type === 'trim-game' || s.type === 'match-game') {
            nextBtn.disabled = true;
            nextBtn.classList.add('btn-disabled');
            nextBtn.innerText = "PLAY TO UNLOCK";
        } else if (['intro', 'read'].includes(s.type)) {
            // Handled by lockNavigation
        } else {
            // Quiz slides (allow clicking options to advance, but button can be auxiliary)
            nextBtn.style.display = 'none'; 
        }
        
        if(s.type !== 'quiz') nextBtn.style.display = 'block';

        if (s.type === 'trim-game') initTrimGame(s);
        if (s.type === 'match-game') initMatchGame(s);
        if (s.type === 'quiz') initQuiz(s);
    }

    // --- NAVIGATION LOCK ---
    function lockNavigation(seconds) {
        const btn = document.getElementById('nextBtn');
        if(!btn) return;
        
        btn.disabled = true;
        btn.classList.add('btn-disabled');
        let timeLeft = seconds;
        
        btn.innerText = `READING... (${timeLeft})`;
        
        if(navTimer) clearInterval(navTimer);
        
        navTimer = setInterval(() => {
            timeLeft--;
            btn.innerText = `READING... (${timeLeft})`;
            if(timeLeft <= 0) {
                clearInterval(navTimer);
                btn.disabled = false;
                btn.classList.remove('btn-disabled');
                btn.innerText = "ACTION ❯";
            }
        }, 1000);
    }

    function unlockGameBtn() {
        const btn = document.getElementById('nextBtn');
        if(btn) {
            btn.disabled = false;
            btn.classList.remove('btn-disabled');
            btn.innerText = "ACTION ❯";
        }
    }

    function nextSlide() { 
        if(navTimer) clearInterval(navTimer); 
        slideIndex++; 
        renderSlide(); 
    }
    
    function prevSlide() { 
        if(navTimer) clearInterval(navTimer);
        if(slideIndex > 0) {
            slideIndex--; 
            renderSlide(); 
        }
    }

    // --- GAME LOGIC ---
    function initTrimGame(s) {
        const area = document.getElementById('trim-opts');
        s.options.forEach(txt => {
            let btn = document.createElement('div');
            btn.className = 'quiz-option'; btn.innerText = txt;
            btn.onclick = () => {
                if (txt === s.ans) { 
                    btn.classList.add('correct'); 
                    alert(`🎬 CUT! เยี่ยมมากค่ะ\n${s.reason}`); 
                    unlockGameBtn();
                }
                else { btn.classList.add('wrong'); alert("❌ ยังไม่ดีค่ะ ยาวไปหรือความหมายเปลี่ยน ลองใหม่นะคะ"); }
            };
            area.appendChild(btn);
        });
    }

    function initMatchGame(s) {
        const area = document.getElementById('match-opts');
        let choices = shuffleArray([...s.options]);
        choices.forEach(txt => {
            let btn = document.createElement('div');
            btn.className = 'quiz-option'; btn.innerText = txt;
            btn.onclick = () => {
                if (txt === s.ans) { 
                    btn.classList.add('correct'); 
                    alert(s.feedback || `✨ Perfect! สละสลวยมากค่ะ`); 
                    unlockGameBtn();
                }
                else { 
                    btn.classList.add('wrong'); 
                    alert("🤔 ยังไม่ค่อยโดนใจ ลองใหม่นะคะ"); 
                }
            };
            area.appendChild(btn);
        });
    }

    function initQuiz(s) {
        const area = document.getElementById('quiz-options');
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.style.display = 'none'; // Hide next button in quiz, auto advance

        s.options.forEach((opt, idx) => {
            let btn = document.createElement('div');
            btn.className = 'quiz-option'; btn.innerText = opt;
            btn.onclick = () => {
                const all = document.querySelectorAll('.quiz-option'); all.forEach(b => b.classList.add('locked'));
                if (idx === s.ans) { btn.classList.add('correct'); quizScore++; setTimeout(() => nextSlide(), 500); }
                else { btn.classList.add('wrong'); all[s.ans].classList.add('correct'); setTimeout(() => nextSlide(), 1500); }
            };
            area.appendChild(btn);
        });
    }

    // --- RESULT ---
    function showResult() {
        document.getElementById('screen-lesson').style.display = "none";
        document.getElementById('footerBar').style.display = "none"; // Hide footer
        const resScreen = document.getElementById('screen-result');
        resScreen.style.display = "flex";
        const passed = (quizScore === 10);
        const now = new Date();
        const dateStr = now.toLocaleDateString('th-TH');
        const refCode = "U6-" + Math.random().toString(36).substr(2, 6).toUpperCase();

        if (passed) {
            resScreen.innerHTML = `
                <h2 style="color:var(--success); border-bottom:none;">It's a Wrap! 🎬</h2>
                <div class="cert-card">
                    <div class="watermark-container" id="wm-area"></div>
                    <div class="cert-content">
                        <div class="cert-header">Translation Studio</div>
                        <p style="color:#888; letter-spacing:2px; font-size:0.8em; margin-bottom:15px;">CERTIFICATE OF COMPLETION</p>
                        <div style="font-size:1.6em; font-weight:bold; color:var(--primary); margin:15px 0; font-family:'Prompt';">${currentUser.name}</div>
                        <p style="color:#ddd;">${currentUser.class} | No. ${currentUser.no}</p>
                        <div style="font-size:3em; font-weight:bold; color:var(--success); margin:15px 0;">10/10</div>
                        <div class="stamp">MASTERPIECE</div>
                        <div style="margin-top:20px; font-size:0.8em; color:#666;">Date: ${dateStr} | Ref: ${refCode}</div>
                    </div>
                </div>
                <p style="margin-top:20px; font-size:0.9em; color:#888;">📸 Capture this screen for submission</p>
                <button class="btn btn-sm" onclick="location.reload()" style="margin-top:15px; width:100%;">LOGOUT</button>
            `;
            const wm = document.getElementById('wm-area');
            const txt = `${currentUser.id} ${currentUser.name}`;
            for(let i=0; i<15; i++) { let s = document.createElement('div'); s.className = 'wm-item'; s.innerText = txt; wm.appendChild(s); }
        } else {
            resScreen.innerHTML = `
                <div style="text-align:center; padding:40px; background:#2c0303; border:2px dashed var(--error); border-radius:15px; width:100%;">
                    <div style="font-size:4em;">🎬</div>
                    <h2 style="color:var(--error); border-bottom:none;">Cut! Take 2</h2>
                    <p style="font-size:1.4em; font-weight:bold; color:#fff;">Score: ${quizScore}/10</p>
                    <p style="color:#ccc;">We need perfection (10/10).<br>Let's try again!</p>
                    <button class="btn btn-primary" onclick="restartQuiz()">RE-TAKE SCENE ↺</button>
                </div>
            `;
        }
    }

    function restartQuiz() {
        quizScore = 0;
        const newQuizzes = generateQuizSet();
        currentSessionSlides = [...baseSlides, ...newQuizzes];
        slideIndex = baseSlides.length - 1; 
        document.getElementById('footerBar').style.display = "flex";
        renderSlide();
    }

    function adminReset() {
        const targetSecret = "UGFsb2xpaXo="; 
        let input = prompt("🔐 PRODUCER ACCESS:");
        try {
            if (input && btoa(input) === targetSecret) { localStorage.clear(); alert("✅ STUDIO RESET"); location.reload(); }
            else if (input) { alert("❌ WRONG PASSCODE"); }
        } catch(e) { alert("❌ ERROR"); }
    }
